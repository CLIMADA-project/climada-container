[tool.poetry]
name = "climada-container"
version = "0.1.0"
description = ""
authors = ["MeteoSwiss"]
package-mode = false

[tool.poetry.dependencies]
python = "~3.11"

# CLIMADA dependencies for v4.0.0 (make sure these are in the range allowed by CLIMADA!)
bottleneck= "~=1.3"
cartopy = "~=0.22.0"
cfgrib = "==0.9.9.1" # is fixed because of CLIMADA
contextily = "~=1.3"
dask = { extras = ["dataframe"], version = ">=2024.4.1" }
deprecation = "~=2.1.0"
eccodes = "~=1.6.0" # does not match CLIMADA dependency >= 2.27, < 2.28
fiona = "==1.9.6" # not strictly a CLIMADA dependency, but a transitive dependency incompatible for version >= 1.9.6
geopandas = "~=0.13.0"
h5py = "~=3.8.0"
matplotlib = "~=3.7.1"
netcdf4 = "~=1.6.3"
numba = "~=0.57.0"
openpyxl = "~=3.1.2"
pandas = "~=2.2.1" # not strictly a CLIMADA dependency, but a transitive dependency incompatible for version >= 2.0
pandas-datareader = "~=0.10.0"
pathos = "~=0.3.0"
pint = "~=0.22.0"
pycountry = "~=22.3.5"
pygdal = "==3.6.2.11" # has to match the version from the geospatial-extras base image
pyproj = "~=3.4.1"
rasterio = "~=1.3.6"
scikit-image = "~=0.21.0"
scikit-learn = "~=1.3.0"
scipy = "~=1.11.0"
sparse = "~=0.14"
statsmodels = "~=0.14.0"
tables = "~=3.8.0" # pip install tables is equivalent to conda install pytables https://www.pytables.org/usersguide/installation.html
tabulate = "~=0.9.0"
tqdm = "~=4.66.0"
xarray = "~=2023.8.0"
xlsxwriter = "~=3.1.0"
xyzservices =  "<2023.10.1" # temporary fix can be removed with climada_python version v4.1.1

# dependencies we need apart from CLIMADA dependencies
jupyterlab = ">4.0.0"
jupyter-server="==2.14.0"

#ignore_missing_imports = true
#disallow_untyped_defs = true


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
